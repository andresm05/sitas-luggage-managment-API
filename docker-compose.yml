version: '3.8'

services:
  mysqldb:
    image: "mysql:8.0"
    container_name: sitas-mysqldb
    restart: unless-stopped
    ports:
      - 3307:3306
    networks:
      - springapimysql-net  
    environment:
      MYSQL_DATABASE: sitas
      MYSQL_ROOT_PASSWORD: admin0515

  api_service:
    container_name: sitas-api
    build: .
    restart: unless-stopped
    ports:
      - 8089:8089
    networks:
      - springapimysql-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/sitas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin0515
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_SHOW_SQL: true
    depends_on:
      - mysqldb

networks:
  springapimysql-net:

        

  